<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <!-- Winter night: snowy hills, pines and a cabin with warm windows (Vikendly holiday fallback picture) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10261f"/>
      <stop offset="1" stop-color="#1a3c34"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4c27a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f4c27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- moon and stars -->
  <circle cx="640" cy="110" r="38" fill="#f5f1e8"/>
  <circle cx="626" cy="100" r="38" fill="#10261f" opacity="0.25"/>
  <g fill="#f5f1e8">
    <circle cx="90" cy="70" r="2"/><circle cx="180" cy="130" r="1.5"/><circle cx="260" cy="60" r="2"/>
    <circle cx="350" cy="110" r="1.5"/><circle cx="450" cy="50" r="2"/><circle cx="520" cy="150" r="1.5"/>
    <circle cx="730" cy="200" r="2"/><circle cx="60" cy="190" r="1.5"/><circle cx="400" cy="180" r="1.2"/>
  </g>
  <!-- far hills -->
  <path d="M0 360 Q140 270 290 330 T560 300 T800 320 V600 H0Z" fill="#2c5a4e"/>
  <path d="M0 360 Q140 270 290 330 T560 300 T800 320 V340 Q660 330 560 322 T290 352 T0 380Z" fill="#ece4d3" opacity="0.85"/>
  <!-- pines -->
  <g fill="#0f2a23">
    <path d="M90 420 l38 -110 l38 110z"/><path d="M150 430 l30 -90 l30 90z"/>
    <path d="M610 420 l34 -100 l34 100z"/><path d="M670 432 l28 -84 l28 84z"/><path d="M720 426 l30 -92 l30 92z"/>
  </g>
  <g fill="#f5f1e8">
    <path d="M114 350 l14 -40 l14 40 q-14 -8 -28 0z"/><path d="M632 356 l12 -36 l12 36 q-12 -7 -24 0z"/>
    <path d="M740 364 l10 -30 l10 30 q-10 -6 -20 0z"/>
  </g>
  <!-- window glow -->
  <circle cx="400" cy="420" r="150" fill="url(#glow)"/>
  <!-- cabin -->
  <rect x="320" y="380" width="160" height="100" fill="#7a4a2e"/>
  <g stroke="#5e3822" stroke-width="3"><line x1="320" y1="405" x2="480" y2="405"/><line x1="320" y1="430" x2="480" y2="430"/><line x1="320" y1="455" x2="480" y2="455"/></g>
  <path d="M300 388 L400 310 L500 388 Z" fill="#5e3822"/>
  <path d="M294 392 L400 306 L506 392 L494 398 L400 324 L306 398 Z" fill="#f5f1e8"/>
  <rect x="440" y="318" width="20" height="40" fill="#5e3822"/>
  <rect x="436" y="312" width="28" height="9" fill="#f5f1e8"/>
  <rect x="340" y="410" width="34" height="30" rx="2" fill="#f4c27a"/>
  <rect x="426" y="410" width="34" height="30" rx="2" fill="#f4c27a"/>
  <g stroke="#7a4a2e" stroke-width="3"><line x1="357" y1="410" x2="357" y2="440"/><line x1="443" y1="410" x2="443" y2="440"/></g>
  <rect x="386" y="432" width="28" height="48" fill="#3d2416"/>
  <!-- snow in front -->
  <path d="M0 470 Q200 440 400 478 T800 462 V600 H0Z" fill="#f5f1e8"/>
  <path d="M0 520 Q260 500 470 528 T800 515 V600 H0Z" fill="#ece4d3"/>
  <!-- falling snow -->
  <g fill="#f5f1e8" opacity="0.8">
    <circle cx="120" cy="250" r="3"/><circle cx="220" cy="220" r="2.5"/><circle cx="300" cy="270" r="2"/>
    <circle cx="520" cy="240" r="3"/><circle cx="580" cy="280" r="2"/><circle cx="700" cy="260" r="2.5"/>
    <circle cx="40" cy="300" r="2"/><circle cx="470" cy="210" r="2"/><circle cx="760" cy="300" r="2"/>
  </g>
</svg>
